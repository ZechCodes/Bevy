name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  POETRY_VIRTUALENVS_CREATE: "true"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        python-version: ['3.12', '3.13']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    
    - name: Set up Python ${{ matrix.python-version }}
      id: setup-python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Set up patched uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      with:
        version: "0.13.4"

    - name: Install Poetry with current certificate trust
      run: uv pip install --system "poetry==1.8.5" "certifi>=2026.10.19"
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
      with:
        path: .venv
        key: venv-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
    
    - name: Select the configured Python interpreter
      run: python -m poetry env use python

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: python -m poetry install --no-interaction --no-root
    
    - name: Install project
      run: python -m poetry install --no-interaction
    
    - name: Run tests with coverage
      run: |
        python -m poetry run python -m pytest tests/ --tb=short --cov=bevy --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: true

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    
    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: '3.12'
    
    - name: Set up patched uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      with:
        version: "0.13.4"

    - name: Install Poetry with current certificate trust
      run: uv pip install --system "poetry==1.8.5" "certifi>=2026.10.19"
    
    - name: Select the configured Python interpreter
      run: python -m poetry env use python

    - name: Install dependencies
      run: python -m poetry install --no-interaction
    
    - name: Check code formatting with black
      run: |
        python -m poetry run black --check bevy/ tests/
      continue-on-error: true
    
    - name: Lint with ruff
      run: |
        python -m poetry run ruff check bevy/ tests/
      continue-on-error: true
    
    - name: Type check with mypy
      run: |
        python -m poetry run mypy bevy/
      continue-on-error: true
